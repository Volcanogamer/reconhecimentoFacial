{% extends 'base.html' %}
{% block content %}
<style>
    body {
        background-color: #0d1b2a !important;
        color: #f0f4f8 !important;
    }

    .modal-content {
        background-color: #1b263b !important;
        color: #f0f4f8 !important;
        border: none;
    }

    .modal-header,
    .modal-body,
    .modal-footer {
        border: none !important;
    }

    .navbar-brand{
        color: #f0f4f8 !important;
    }


    .modal-backdrop.show {
        background-color: rgba(246, 247, 248, 0.9);
    }

    #contador {
        color: #f0f4f8;
        font-size: 1.5rem;
        margin-top: 10px;
    }

    .btn-success {
        background-color: #2f9e44;
        border: none;
    }

    .btn-success:hover {
        background-color: #37b24d;
    }

    .btn {
        color: white;
    }
</style>

<div style="text-align:center;">
    <h1>Reconhecimento Facial</h1>

    <video id="camera" autoplay playsinline width="640" height="480" style="transform: scaleX(-1);"></video>
    <div id="contador" class="mt-3 fs-4 fw-bold"></div>

    <!-- Modal de Confirmação -->
    <div class="modal fade" id="modalConfirmacao" tabindex="-1" role="dialog" aria-labelledby="modalConfirmacaoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title w-100 text-center" id="modalConfirmacaoLabel">Confirmar Registro de Ponto</h5>
                </div>
                <div class="modal-body d-flex flex-column align-items-center justify-content-center text-center">
                    <p id="nome-usuario" class="mb-3"></p>
                    <img id="rosto-capturado" src="" width="200" class="rounded mb-3" />
                    <button id="confirmar-btn" class="btn btn-success">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Sucesso -->
    <div class="modal fade" id="modalSucesso" tabindex="-1" role="dialog" aria-labelledby="modalSucessoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="modalSucessoLabel">Registro Concluído</h5>
                </div>
                <div class="modal-body text-center">
                    <p id="mensagem-sucesso" class="fw-bold"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Erro -->
    <div class="modal fade" id="modalErro" tabindex="-1" role="dialog" aria-labelledby="modalErroLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title w-100 text-center" id="modalErroLabel">Rosto Não Reconhecido</h5>
                </div>
                <div class="modal-body text-center">
                    <p class="fw-bold">Não foi possível identificar o rosto.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const video = document.getElementById("camera");
    const contador = document.getElementById("contador");
    const imgPreview = document.getElementById("rosto-capturado");
    const nomeUsuario = document.getElementById("nome-usuario");
    const btnConfirmar = document.getElementById("confirmar-btn");
    let stream;

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => {
            stream = s;
            video.srcObject = stream;

            let tempo = 3;
            const intervalo = setInterval(() => {
                contador.innerText = `Reconhecendo em ${tempo}...`;
                tempo--;
                if (tempo < 0) {
                    clearInterval(intervalo);
                    contador.innerText = "";
                    capturarImagem();
                }
            }, 1000);
        })
        .catch(err => {
            alert("Erro ao acessar a câmera: " + err);
        });

    function pararCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
    }

    function capturarImagem() {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const imagemBase64 = canvas.toDataURL("image/jpeg");

        fetch("{% url 'api_reconhecimento_rosto' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ imagem: imagemBase64 })
        })
        .then(resp => resp.json())
        .then(data => {
            pararCamera();

            if (data.status === "ok") {
                nomeUsuario.innerText = "Usuário: " + data.nome;
                imgPreview.src = imagemBase64;

                const modalConfirmacao = new bootstrap.Modal(document.getElementById("modalConfirmacao"));
                modalConfirmacao.show();

                btnConfirmar.onclick = () => {
                    registrarPonto(data.id_usuario, data.nome, modalConfirmacao);
                };
            } else if (data.status === "invalido") {
                const modalErro = new bootstrap.Modal(document.getElementById("modalErro"));
                document.getElementById("modalErroLabel").innerText = "Acesso Negado";
                document.querySelector("#modalErro .modal-body p").innerText = data.mensagem;
                modalErro.show();

                setTimeout(() => {
                    modalErro.hide();
                    window.location.href = "{% url 'index' %}";
                }, 2500);
            } else {
                const modalErro = new bootstrap.Modal(document.getElementById("modalErro"));
                document.getElementById("modalErroLabel").innerText = "Rosto Não Reconhecido";
                document.querySelector("#modalErro .modal-body p").innerText = "Não foi possível identificar o rosto.";
                modalErro.show();

                setTimeout(() => {
                    modalErro.hide();
                    window.location.href = "{% url 'index' %}";
                }, 1500);
            }
        });
    }

    function registrarPonto(id, nome, modalConfirmacao) {
        fetch("{% url 'api_registrar_ponto' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ id_usuario: id })
        })
        .then(resp => resp.json())
        .then(data => {
            if (data.status === "registrado") {
                modalConfirmacao.hide();

                const agora = new Date();
                const tipo = data.tipo === "entrada" ? "Entrada" : "Saída";
                const hora = agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const mensagem = `${nome} — ${tipo} registrada às ${hora}`;
                document.getElementById("mensagem-sucesso").innerText = mensagem;

                const modalSucesso = new bootstrap.Modal(document.getElementById("modalSucesso"));
                modalSucesso.show();

                setTimeout(() => {
                    window.location.href = "{% url 'index' %}";
                }, 4000);
            } else {
                alert("Erro ao registrar ponto.");
            }
        });
    }
</script>
{% endblock %}
