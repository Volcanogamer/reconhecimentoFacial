{% block content %}
<style>
    .custom-btn {
        padding: 4px 15px;
        font-size: 15px;
    }

    .me-2 {
        margin-right: 0.5rem;
    }
</style>

<div id="registros-content">
    <h3>Registros</h3>

    <form id="filtro-form" class="mb-4 mt-4">
        <input type="text" name="nome" placeholder="Nome" value="{{ request.GET.nome }}" class="me-2">
        <input type="date" name="data" value="{{ request.GET.data }}" class="me-2">
        <select name="tipo" class="me-2">
            <option value="">Todos</option>
            <option value="entrada" {% if request.GET.tipo == "entrada" %}selected{% endif %}>Entrada</option>
            <option value="saida" {% if request.GET.tipo == "saida" %}selected{% endif %}>Saída</option>
        </select>
        <button type="submit" class="btn btn-primary custom-btn me-2">Filtrar</button>
        <button type="button" class="btn btn-success custom-btn" onclick="exportarPDF()">Exportar para PDF</button>
    </form>

    <div class="table-responsive">
        <table class="table table-dark table-hover rounded shadow" id="tabela-registros">
            <thead class="table-light text-dark">
                <tr>
                    <th>Usuário</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody>
                {% for r in registros %}
                <tr>
                    <td>{{ r.usuario.nome }}</td>
                    <td>{{ r.data|date:"d/m/Y" }}</td>
                    <td>{{ r.hora|time:"H:i:s" }}</td>
                    <td>
                        {% if r.tipo == "entrada" %}
                            <span class="badge bg-success">Entrada</span>
                        {% else %}
                            <span class="badge bg-danger">Saída</span>
                        {% endif %}
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum registro encontrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
    function exportarPDF() {
        const element = document.getElementById("registros-content");
        const opt = {
            margin:       0.5,
            filename:     'registros.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save();
    }
</script>

{% endblock %}
