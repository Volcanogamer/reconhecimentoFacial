{% block content %}

<style>
    .custom-btn {
      padding: 4px 15px;
      font-size: 15px;
    }
</style>

<div id="registros-content">
    <h3>Registros</h3>

    <form id="filtro-form" class="mb-4 mt-4">
        <input type="text" name="nome" placeholder="Nome" value="{{ request.GET.nome }}" class="me-2">
        <input type="date" name="data" value="{{ request.GET.data }}" class="me-2">
        <select name="tipo" class="me-2">
            <option value="">Todos</option>
            <option value="entrada" {% if request.GET.tipo == 'entrada' %}selected{% endif %}>Entrada</option>
            <option value="saida" {% if request.GET.tipo == 'saida' %}selected{% endif %}>Saída</option>
        </select>
        <button type="submit" class="btn btn-primary custom-btn">Filtrar</button>
    </form>
    
    <div class="table-responsive">
        <table class="table table-dark table-hover rounded shadow">
            <thead class="table-light text-dark">
                <tr>
                    <th>Usuário</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody>
                {% for r in registros %}
                <tr>
                    <td>{{ r.usuario.nome }}</td>
                    <td>{{ r.data|date:"d/m/Y" }}</td>
                    <td>{{ r.hora|time:"H:i:s" }}</td>
                    <td>
                        {% if r.tipo == "entrada" %}
                            <span class="badge bg-success">Entrada</span>
                        {% else %}
                            <span class="badge bg-danger">Saída</span>
                        {% endif %}
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">Nenhum registro encontrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
