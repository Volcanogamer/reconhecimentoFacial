<!-- templates/admin/conteudo/treinamentos.html -->
<div class="table-responsive">
    <table class="table table-dark table-hover rounded shadow">
        <thead class="table-light text-dark">
            <tr>
                <th>Usuário</th>
                <th>Data do Treinamento</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for t in treinamentos %}
            <tr>
                <td>{{ t.usuario.nome }}</td>
                <td>{{ t.data_treinamento|date:"d/m/Y H:i" }}</td>
                <td>{{ t.status|default:"-" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">Nenhum treinamento encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
