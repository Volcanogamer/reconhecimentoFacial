{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <div class="row">

        <!-- Menu Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar text-light py-4">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-light" href="#"
                        onclick="loadContent('usuarios')">Usuários</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#" onclick="loadContent('treinamentos')">Treinamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#" onclick="loadContent('registros')">Registros</a>
                </li>
            </ul>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="conteudo-dashboard">
            <h3>Bem-vindo ao Painel Administrativo</h3>
            <p>Escolha uma opção no menu ao lado para visualizar os dados.</p>
        </main>
    </div>
</div>

<script>
    function loadContent(tipo) {
        fetch(`/dashboard/${tipo}/`)
            .then(resp => {
                if (!resp.ok) throw new Error('Erro na requisição');
                return resp.text();
            })
            .then(html => {
                const container = document.getElementById('conteudo-dashboard');
                container.innerHTML = html;

                // Executa scripts apenas para a página de treinamentos
                if (tipo === 'treinamentos') {
                    const scripts = container.querySelectorAll("script");
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement("script");
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.text = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                }
            })
            .catch(err => console.error('Erro:', err));
    }

    function loadUsuarioDetalhes(id) {
    fetch(`/dashboard/usuarios/${id}/`)
        .then(resp => {
            if (!resp.ok) throw new Error('Erro ao carregar detalhes do usuário.');
            return resp.text();
        })
        .then(html => {
            document.getElementById('conteudo-dashboard').innerHTML = html;
        })
        .catch(err => console.error('Erro:', err));
    }

    document.body.addEventListener('submit', function (e) {
        if (e.target && e.target.id === 'filtro-form') {
            e.preventDefault();

            const form = e.target;
            const params = new URLSearchParams(new FormData(form)).toString();

            fetch(`/dashboard/registros/?${params}`)
                .then(resp => {
                    if (!resp.ok) throw new Error("Erro ao filtrar registros.");
                    return resp.text();
                })
                .then(html => {
                    document.getElementById('conteudo-dashboard').innerHTML = html;
                })
                .catch(err => {
                    console.error(err);
                    alert("Erro ao aplicar o filtro.");
                });
        }
    });
</script>
{% endblock %}
