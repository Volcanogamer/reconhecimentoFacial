{% extends 'base.html' %}
{% block content %}

<h1 id="titulo" class="mb-4 fade-in">Reconhecimento Facial</h1>

<!-- Vídeo da câmera -->
<video id="camera" autoplay playsinline width="640" height="480"
    class="fade-in" style="border: 2px solid #1c7ed6; border-radius: 10px; transform: scaleX(-1);"></video>

<!-- Contagem Regressiva -->
<h2 id="contador" class="mt-3 fade-in">Reconhecendo em 3...</h2>

<!-- Resultado: nome + registros -->
<div id="resultado" class="mt-4 fade-in" style="display: none; max-width: 700px; width: 100%;">
    <h3 id="nome-usuario" class="mb-3"></h3>
    
    <div style="max-height: 320px; overflow-y: auto; border: 1px solid #415a77; border-radius: 8px;">
        <table class="table table-dark table-striped mb-0">
            <thead class="sticky-top bg-dark">
                <tr>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody id="tabela-registros">
                <!-- Dados via JS -->
            </tbody>
        </table>
    </div>

    <div class="text-end mt-3">
        <a href="{% url 'index' %}" class="btn btn-primary">Voltar ao Início</a>
    </div>
</div>

<style>
    .fade-in {
        opacity: 1;
        transition: opacity 0.6s ease;
    }

    .fade-out {
        opacity: 0;
        transition: opacity 0.6s ease;
    }

    thead th {
        position: sticky;
        top: 0;
        background-color: #1b263b !important;
        z-index: 2;
    }
</style>

<script>
    const video = document.getElementById('camera');
    const titulo = document.getElementById('titulo');
    const contador = document.getElementById('contador');
    const resultadoDiv = document.getElementById('resultado');
    const nomeUsuario = document.getElementById('nome-usuario');
    const tabelaRegistros = document.getElementById('tabela-registros');

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;

            let segundos = 3;
            const intervalo = setInterval(() => {
                contador.textContent = `Reconhecendo em ${segundos}...`;
                segundos--;
                if (segundos < 0) {
                    clearInterval(intervalo);
                    contador.textContent = 'Reconhecendo...';
                    capturarEReconhecer();
                }
            }, 1000);
        })
        .catch(error => {
            contador.textContent = "Erro ao acessar a câmera.";
            console.error(error);
        });

    function capturarEReconhecer() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const imagemBase64 = canvas.toDataURL('image/jpeg');

        fetch("{% url 'ver_resumo_reconhecimento' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ imagem: imagemBase64 })
        })
        .then(response => response.json())
        .then(data => {
            if (data.sucesso) {
                nomeUsuario.textContent = `Olá, ${data.nome}`;
                tabelaRegistros.innerHTML = "";
                data.registros.forEach(reg => {
                    tabelaRegistros.innerHTML += `
                        <tr>
                            <td>${reg.data}</td>
                            <td>${reg.hora}</td>
                            <td>${reg.tipo}</td>
                        </tr>`;
                });

                // Esconde câmera e contador com efeito
                titulo.classList.add('fade-out');
                video.classList.add('fade-out');
                contador.classList.add('fade-out');

                setTimeout(() => {
                    titulo.style.display = 'none';
                    video.style.display = 'none';
                    contador.style.display = 'none';

                    // Encerra a câmera
                    const tracks = video.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    video.srcObject = null;

                    resultadoDiv.style.display = "block";
                }, 600);
            } else {
                contador.textContent = "Rosto não reconhecido.";
            }
        });
    }
</script>

{% endblock %}
