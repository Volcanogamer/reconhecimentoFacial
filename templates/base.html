{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FacePonto – Registro de Ponto</title>
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(to right, #89959d, #1b85c2);
        }

        .btn-lg {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            border-radius: 0.75rem;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .vh-100-custom {
            min-height: calc(100vh - 80px);
        }

        .footer {
            text-align: center;
            padding: 1rem;
            color: #000000;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="">📸 FacePonto</a>
            <div class="d-flex">
                <a href="{% url 'admin:login' %}" class="btn btn-outline-secondary">Login Admin</a>
            </div>
        </div>
    </nav>

    <!-- MENSAGENS DJANGO -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- CORPO CENTRAL COM BOTÕES -->
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100-custom text-center">
        <a href="{% url 'video_reconhecimento' %}" class="btn btn-primary btn-lg mb-3 w-75">
            🔘 Registrar Ponto
        </a>

        

        <a href="{% url 'criar_usuario' %}" class="btn btn-warning btn-lg w-75">
            ➕ Cadastrar Usuário
        </a>
    </div>

    <div class="footer">
        &copy; 2025 FacePonto – Sistema de Registro de Ponto Facial
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
