<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacePonto</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0d1b2a;
            color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }

        main {
            flex: 1;
        }

        .navbar {
            background-color: #1b263b;
        }

        .navbar-brand,
        .nav-link,
        .btn-outline-light {
            color: #f0f4f8;
        }

        .navbar-brand:hover,
        .nav-link:hover {
            color: #cce3ff;
        }

        .alert {
            background-color: #1b263b;
            border: 1px solid #415a77;
            color: #f0f4f8;
        }

        .btn-primary {
            background-color: #1c7ed6;
            border: none;
        }

        .btn-warning {
            background-color: #fab005;
            border: none;
            color: #000;
        }

        .btn-success {
            background-color: #2f9e44;
            border: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        footer {
            background-color: #1b263b;
            color: #aabecf;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">FacePonto</a>
            <div class="d-flex">
                <a class="btn btn-outline-light" href="{% url 'login' %}">Login Admin</a>
            </div>
        </div>
    </nav>

    <!-- Django Messages -->
    <div class="container mt-3">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"
                aria-label="Fechar"></button>
        </div>
        {% endfor %}
        {% endif %}
    </div>

    <!-- Corpo da Página -->
    <main class="container d-flex flex-column align-items-center justify-content-center text-center"
        style="min-height: 70vh;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-3 mt-auto">
        <small>&copy; 2025 FacePonto. Todos os direitos reservados.</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
